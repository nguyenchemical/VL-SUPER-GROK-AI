<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vietlott Super Grok AI</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<meta name="theme-color" content="#141e30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Super Grok AI">
<meta name="application-name" content="Super Grok AI">
<link id="pwa-manifest-link" rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{
  --bg-dark:linear-gradient(160deg,#0f172a 0%,#1e293b 50%,#243b55 100%);
  --bg-light:linear-gradient(160deg,#f8fafc,#e2e8f0);
  --card-d:#1a2332; --card-l:#fff;
  --btn:linear-gradient(45deg,#ffcc00,#ff9900);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{height:100%;margin:0;overflow:hidden;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:'Poppins',system-ui,sans-serif;
  background:var(--bg-dark);color:#f1f5f9;
  display:flex;flex-direction:column;
  padding:var(--safe-t) env(safe-area-inset-right) var(--safe-b) env(safe-area-inset-left);
  transition:background .3s,color .3s;
}
body.light{background:var(--bg-light);color:#1e293b;}
@supports(height:100dvh){body{height:100dvh;}}

/* Header */
.hdr{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:6px 10px;flex-shrink:0;
  background:rgba(15,23,42,.95);border-bottom:1px solid rgba(255,204,0,.12);
  backdrop-filter:blur(8px);
}
body.light .hdr{background:rgba(255,255,255,.96);border-bottom-color:rgba(0,0,0,.06);}
.logo-row{display:flex;align-items:center;gap:8px;min-width:0;}
.logo{width:40px;height:40px;border-radius:18%;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-shrink:0;}
@media(min-width:400px){.logo{width:46px;height:46px;}}
.logo-t h1{
  font-family:'Playfair Display',serif;font-size:.82rem;margin:0;
  background:linear-gradient(90deg,#ef4444,#fbbf24,#34d399);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@media(min-width:400px){.logo-t h1{font-size:.95rem;}}
.logo-t p{margin:0;font-size:.55rem;opacity:.6;}
.hdr-r{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.hb{
  width:32px;height:32px;border:none;border-radius:8px;cursor:pointer;
  background:rgba(255,204,0,.12);color:#fbbf24;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;
}
body.light .hb{background:rgba(0,0,0,.06);color:#b45309;}
.live{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:50px;font-size:.6rem;font-weight:700;
  background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25);
  white-space:nowrap;
}
.live.ok{background:rgba(16,185,129,.12);color:#34d399;border-color:rgba(16,185,129,.3);}
.ldot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.live:not(.ok) .ldot{animation:ping 1s infinite;}
@keyframes ping{50%{opacity:.3}}

/* Main — no page scroll, internal only if needed */
.main{
  flex:1;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding:6px 8px 8px;
  width:100%;
}
.card{
  width:100%;max-width:520px;flex:1;min-height:0;
  display:flex;flex-direction:column;
  background:var(--card-d);border-radius:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);
  padding:8px 10px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
@media(min-width:768px){
  .main{padding:10px 16px 12px;}
  .card{max-width:720px;padding:12px 16px 14px;border-radius:18px;}
  .logo{width:52px;height:52px;}
  .logo-t h1{font-size:1.1rem;}
  .ball{width:40px;height:40px;font-size:.88rem;}
  button.g{font-size:.8rem;padding:8px 12px;}
}
@media(min-width:1024px){
  .card{max-width:820px;}
}
body.light .card{background:var(--card-l);box-shadow:0 10px 28px rgba(0,0,0,.1);}

.badge{
  display:inline-block;align-self:center;
  padding:3px 12px;background:gold;color:#111;
  font-weight:700;border-radius:50px;font-size:.68rem;margin-bottom:2px;
}
.title{
  font-family:'Playfair Display',serif;text-align:center;
  font-size:1.05rem;margin:0 0 4px;
}
body.light .title{color:#1e293b;}

/* Sections compact */
.sec{flex-shrink:0;}
.sec-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sec-h{
  font-size:.72rem;font-weight:700;margin:4px 0 3px;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.sec-h .tag{
  font-size:.58rem;font-weight:600;padding:1px 6px;border-radius:6px;
  background:rgba(251,191,36,.15);color:#fbbf24;
}
hr.d{border:none;border-top:1px solid rgba(255,255,255,.08);margin:5px 0;}
body.light hr.d{border-top-color:rgba(0,0,0,.07);}

button.g{
  margin:2px;padding:6px 10px;border:none;border-radius:50px;
  background:var(--btn);color:#111;font-weight:600;font-family:inherit;
  font-size:.72rem;cursor:pointer;display:inline-block;transition:.2s;
}
button.g:active{transform:scale(.96);}
button.g:disabled{opacity:.45;cursor:not-allowed;}
button.g.primary{padding:8px 14px;font-size:.78rem;font-weight:700;}

select.s{
  padding:4px 6px;margin:1px;border-radius:8px;font-size:.75rem;font-family:inherit;
  border:1px solid rgba(255,255,255,.12);background:#0f172a;color:#f1f5f9;
}
body.light select.s{background:#f1f5f9;color:#1e293b;border-color:#cbd5e1;}

/* Result balls */
#resultArea{
  min-height:40px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:3px;padding:2px 0;
}
.ball{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  font-weight:800;font-size:.78rem;color:#fff;
  box-shadow:inset -1.5px -1.5px 3px rgba(0,0,0,.4),0 1.5px 4px rgba(0,0,0,.3);
  animation:pop .3s ease;flex-shrink:0;
}
@media(min-width:400px){.ball{width:38px;height:38px;font-size:.85rem;}}
@media(min-width:768px){.ball{width:42px;height:42px;font-size:.92rem;}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
/* Vietlott official-like colors from screenshot */
.b-mega{background:radial-gradient(circle at 32% 28%,#ff6b6b,#e11d48,#9f1239);}
.b-power{background:radial-gradient(circle at 32% 28%,#fde68a,#d97706,#92400e);}
.b-power-sp{background:radial-gradient(circle at 32% 28%,#ff6b6b,#e11d48,#9f1239);border:2px solid #fbbf24;}
.b-lotto{background:radial-gradient(circle at 32% 28%,#4ade80,#16a34a,#14532d);}
.b-lotto-sp{background:radial-gradient(circle at 32% 28%,#fb923c,#ea580c,#9a3412);}
.b-max3d{background:radial-gradient(circle at 32% 28%,#e879f9,#c026d3,#701a75);}
.b-keno{background:radial-gradient(circle at 32% 28%,#60a5fa,#2563eb,#1e3a8a);}
.b-bingo{background:radial-gradient(circle at 32% 28%,#a78bfa,#7c3aed,#4c1d95);}
.div3d{display:inline-block;width:2px;height:22px;background:#64748b;margin:0 3px;align-self:center;border-radius:1px;}

.scan{font-weight:700;color:#ff9900;font-size:.78rem;animation:blink .5s infinite alternate;padding:6px;}
@keyframes blink{from{opacity:.4}to{opacity:1}}

/* Meter compact */
.meter{margin-top:4px;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.06);}
body.light .meter{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.06);}
.meter-t{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.meter-l{font-size:.6rem;font-weight:700;text-transform:uppercase;opacity:.85;}
.meter-b{font-size:.55rem;font-weight:800;padding:2px 6px;border-radius:50px;background:rgba(148,163,184,.2);color:#94a3b8;}
.mbar-bg{height:6px;border-radius:50px;background:rgba(255,255,255,.08);overflow:hidden;}
.mbar{height:100%;width:0%;border-radius:50px;background:linear-gradient(90deg,#3b82f6,#fbbf24,#ef4444);transition:width .8s cubic-bezier(.22,1,.36,1);}
.meter-bot{display:flex;justify-content:space-between;margin-top:3px;font-size:.6rem;opacity:.8;}

/* TF zone */
.tf-zone{text-align:center;}
.hint{font-size:.6rem;opacity:.65;margin:2px 0;}
.pbg{height:4px;border-radius:50px;background:rgba(255,255,255,.1);margin:3px 0;overflow:hidden;}
.pfill{height:100%;width:0%;background:linear-gradient(90deg,#ef4444,#fbbf24,#34d399);transition:width .12s;}
.log{
  padding:4px 6px;border-radius:8px;background:rgba(0,0,0,.28);
  font-family:ui-monospace,monospace;font-size:.55rem;text-align:left;
  max-height:36px;overflow-y:auto;line-height:1.35;color:#94a3b8;
}
body.light .log{background:rgba(0,0,0,.05);color:#64748b;}
.log b{color:#34d399;}
.sets{margin-top:3px;text-align:left;}
.set-row{
  display:flex;align-items:center;gap:4px;padding:4px 6px;margin-bottom:3px;
  border-radius:8px;background:rgba(0,0,0,.18);flex-wrap:wrap;
}
body.light .set-row{background:rgba(0,0,0,.04);}
.set-tag{font-size:.55rem;font-weight:700;padding:1px 5px;border-radius:5px;background:rgba(251,191,36,.15);color:#fbbf24;}

.btns{text-align:center;line-height:1.1;}
.game-label{font-size:.58rem;opacity:.7;margin-bottom:2px;text-align:center;}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo-row">
    <img src="icon.png" alt="Super Grok AI" class="logo" width="46" height="46">
    <div class="logo-t">
      <h1>Vietlott Super Grok AI</h1>
      <p>Live · TensorFlow.js</p>
    </div>
  </div>
  <div class="hdr-r">
    <button class="hb" id="btnTheme" onclick="toggleDark()" title="Sáng/Tối">🌙</button>
    <button class="hb" id="btnSound" onclick="toggleSound()" title="Âm thanh">🔊</button>
    <span class="live" id="dataStatus"><span class="ldot"></span><span id="dataStatusText">Live...</span></span>
  </div>
</header>

<div class="main">
<div class="card">

  <div class="badge">PHIÊN BẢN AI PRO</div>
  <div class="title">Dự Đoán Vietlott AI</div>

  <!-- 1. HUẤN LUYỆN TENSORFLOW AI (đầu tiên) -->
  <div class="sec tf-zone">
    <div class="sec-h">🧠 Huấn luyện TensorFlow AI</div>
    <select class="s" id="gameTypeTf" onchange="onGameChange()">
      <option value="mega645">Mega 6/45</option>
      <option value="power655">Power 6/55</option>
      <option value="lotto535">Lotto 5/35</option>
      <option value="max3d">Max 3D</option>
      <option value="max3dpro">Max 3D Pro</option>
    </select>
    <p class="hint" id="autoAlgoHint">Model: tự động</p>
    <div class="pbg"><div class="pfill" id="trainProgress"></div></div>
    <div class="log" id="trainLog">Sẵn sàng…</div>
    <button class="g primary" id="btnTrain" onclick="trainAndPredict()">🚀 HUẤN LUYỆN TENSORFLOW AI</button>
    <div class="sets" id="predictionsList"></div>
  </div>

  <hr class="d">

  <!-- 2. KẾT QUẢ + tên game đang dự đoán -->
  <div class="sec">
    <div class="game-label" id="resultGameLabel">Chọn loại hình hoặc nhấn AI để dự đoán</div>
    <div id="resultArea"></div>
    <div id="scanArea"></div>
    <div class="meter">
      <div class="meter-t">
        <span class="meter-l">🔥 Thước Đo Jackpot</span>
        <span class="meter-b" id="meterBadge">CHỜ TÍNH...</span>
      </div>
      <div class="mbar-bg"><div class="mbar" id="meterBar"></div></div>
      <div class="meter-bot">
        <span>Hội tụ AI: <b id="meterScore">0%</b></span>
        <span>Tích lũy: <b id="jackpotVal">—</b></span>
      </div>
    </div>
  </div>

  <hr class="d">

  <!-- 3. Nút game nhanh -->
  <div class="sec btns">
    <button class="g" onclick="runGame('mega645')">Mega 6/45</button>
    <button class="g" onclick="runGame('power655')">Power 6/55</button>
    <button class="g" onclick="runGame('max3d')">Max 3D</button>
    <button class="g" onclick="runGame('max3dpro')">Max 3D Pro</button>
    <button class="g" onclick="runGame('keno')">Keno</button>
    <button class="g" onclick="runGame('lotto535')">Lotto 5/35</button>
    <button class="g" onclick="runGame('bingo')">Bingo 18</button>
    <button class="g" onclick="runSmartAI()">🤖 AI Thông Minh</button>
  </div>

  <hr class="d">

  <!-- 4. Ngày sinh + tên game -->
  <div class="sec" style="text-align:center">
    <div class="sec-h">Tạo theo ngày sinh <span class="tag" id="birthGameTag">Mega 6/45</span></div>
    <select class="s" id="day"></select>
    <select class="s" id="month"></select>
    <select class="s" id="year"></select>
    <button class="g" onclick="generateBirth()">Tạo theo ngày sinh</button>
  </div>

  <hr class="d">

  <!-- 5. AI phân tích + tên game -->
  <div class="sec btns">
    <div class="sec-h">Bộ số AI phân tích <span class="tag" id="aiGameTag">Mega 6/45</span></div>
    <button class="g" onclick="presetNums('hot')">🔥 Số HOT</button>
    <button class="g" onclick="presetNums('freq')">📈 Hay ra nhiều</button>
    <button class="g" onclick="presetNums('high')">⭐ Cơ hội cao</button>
    <button class="g" onclick="presetNums('popular')">👥 Được chọn nhiều</button>
  </div>

</div>
</div>

<script>
const WORKER_BASE="https://grok.nguyenchemical.workers.dev/";
const GITHUB_RAW_BASE="https://raw.githubusercontent.com/nguyenchemical/VL-LIVE-CLASS-GROK-AI/main/data/";
const APP_SHARED_SECRET="";
const VIETLOTT_PATH={mega645:"645",power655:"655",lotto535:"535",max3d:"max-3d",max3dpro:"max-3dpro",max3dplus:"max-3d"};
const GAME_NAMES={mega645:"Mega 6/45",power655:"Power 6/55",lotto535:"Lotto 5/35",max3d:"Max 3D",max3dpro:"Max 3D Pro",keno:"Keno",bingo:"Bingo 18"};

let rawDraws=[];
let currentGame="mega645";
let soundEnabled=true;
let audioCtx=null;
let lastMeterScore=0;
let lastPredictionProbs=null; // phân phối xác suất AI thật gần nhất
let lastRealJackpotBillion=null;
let lastSeenDrawId=null;

(function(){
  try{
    var m={name:"Super Grok AI",short_name:"Grok AI",description:"Vietlott Super Grok AI",start_url:"./index.html",display:"standalone",background_color:"#141e30",theme_color:"#141e30",icons:[{src:"icon.png",sizes:"192x192",type:"image/png"},{src:"icon.png",sizes:"512x512",type:"image/png"}]};
    var u=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/json"}));
    var el=document.getElementById("pwa-manifest-link"); if(el) el.href=u;
  }catch(e){}
})();

function initAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
function playClick(){if(!soundEnabled)return;initAudio();if(!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=800;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.2,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+0.05)}catch(e){}}
function playResult(){if(!soundEnabled)return;initAudio();if(!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.value=500;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.25,audioCtx.currentTime);o.start();o.stop(audioCtx.currentTime+0.08);setTimeout(function(){var o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.type="triangle";o2.frequency.value=900;o2.connect(g2);g2.connect(audioCtx.destination);g2.gain.setValueAtTime(0.25,audioCtx.currentTime);o2.start();o2.stop(audioCtx.currentTime+0.08)},80)}catch(e){}}
function toggleSound(){soundEnabled=!soundEnabled;document.getElementById("btnSound").textContent=soundEnabled?"🔊":"🔇";playClick()}
function toggleDark(){var L=document.body.classList.toggle("light");document.documentElement.classList.toggle("dark",!L);document.getElementById("btnTheme").textContent=L?"☀️":"🌙";playClick()}
document.addEventListener("touchstart",initAudio,{once:true});
document.addEventListener("click",initAudio,{once:true});
function vibratePhone(){if(navigator.vibrate)navigator.vibrate(160)}
function fireworks(){if(typeof confetti==="function"){confetti({particleCount:60,spread:55,origin:{y:0.55}});setTimeout(function(){confetti({particleCount:30,angle:60,spread:40,origin:{x:0,y:0.6}})},150);setTimeout(function(){confetti({particleCount:30,angle:120,spread:40,origin:{x:1,y:0.6}})},250)}}

for(var i=1;i<=31;i++) day.innerHTML+='<option value="'+i+'">'+i+'</option>';
for(var i=1;i<=12;i++) month.innerHTML+='<option value="'+i+'">'+i+'</option>';
for(var i=1950;i<=2026;i++) year.innerHTML+='<option value="'+i+'">'+i+'</option>';

function setResultLabel(gameType, mode){
  var name=GAME_NAMES[gameType]||gameType;
  var el=document.getElementById("resultGameLabel");
  if(mode==="ai") el.textContent="AI dự đoán · "+name;
  else if(mode==="birth") el.textContent="Theo ngày sinh · "+name;
  else if(mode==="preset") el.textContent="AI phân tích · "+name;
  else el.textContent="Dự đoán · "+name;
  document.getElementById("birthGameTag").textContent=name;
  document.getElementById("aiGameTag").textContent=name;
}

function renderBalls(numbers, gameType){
  if(!numbers||!numbers.length) return "";
  var isDigit=String(gameType).indexOf("max3d")===0;
  if(isDigit){
    if(numbers.length>=2){
      return numbers[0].toString().split("").map(function(d){return '<span class="ball b-max3d">'+d+'</span>'}).join("")
        +'<span class="div3d"></span>'
        +numbers[1].toString().split("").map(function(d){return '<span class="ball b-max3d">'+d+'</span>'}).join("");
    }
    return numbers[0].toString().split("").map(function(d){return '<span class="ball b-max3d">'+d+'</span>'}).join("");
  }
  if(gameType==="power655"&&numbers.length>=7){
    var main=numbers.slice(0,6).map(function(n){return '<span class="ball b-power">'+(n<10?"0"+n:n)+'</span>'}).join("");
    return main+'<span class="ball b-power-sp">'+(numbers[6]<10?"0"+numbers[6]:numbers[6])+'</span>';
  }
  if(gameType==="lotto535"&&numbers.length>=6){
    var main=numbers.slice(0,5).map(function(n){return '<span class="ball b-lotto">'+(n<10?"0"+n:n)+'</span>'}).join("");
    return main+'<span class="ball b-lotto-sp">'+(numbers[5]<10?"0"+numbers[5]:numbers[5])+'</span>';
  }
  var cls="b-mega";
  if(gameType==="power655") cls="b-power";
  else if(gameType==="lotto535") cls="b-lotto";
  else if(gameType==="keno") cls="b-keno";
  else if(gameType==="bingo") cls="b-bingo";
  return numbers.map(function(n){
    var label=(typeof n==="number"&&n<10)?"0"+n:n;
    return '<span class="ball '+cls+'">'+label+'</span>';
  }).join("");
}
function displayResult(numbers, gameType, mode){
  document.getElementById("resultArea").innerHTML=renderBalls(numbers, gameType||currentGame);
  document.getElementById("scanArea").innerHTML="";
  setResultLabel(gameType||currentGame, mode||"quick");
}
function showScan(cb){
  document.getElementById("resultArea").innerHTML="";
  document.getElementById("scanArea").innerHTML="<div class='scan'>🤖 AI đang phân tích dữ liệu thật...</div>";
  playClick();vibratePhone();
  setTimeout(function(){document.getElementById("scanArea").innerHTML="";cb();playResult();fireworks()},850);
}

/* ========== THỂ LỆ + TẦN SUẤT THẬT TỪ LỊCH SỬ ========== */
function gameSpec(gameType){
  if(gameType==="power655") return {maxN:55,count:6,special:true,specialMax:55,isDigit:false};
  if(gameType==="lotto535") return {maxN:35,count:5,special:true,specialMax:12,isDigit:false};
  if(gameType==="keno") return {maxN:80,count:10,special:false,isDigit:false};
  if(gameType==="bingo") return {maxN:90,count:18,special:false,isDigit:false};
  if(String(gameType).indexOf("max3d")===0) return {maxN:10,count:3,special:false,isDigit:true,pairs:gameType!=="max3d"};
  return {maxN:45,count:6,special:false,isDigit:false};
}

/** Phân phối tần suất THẬT từ rawDraws (0..1 normalized). Không bịa số. */
function buildFreqProbs(gameType){
  var spec=gameSpec(gameType);
  var featureSize=spec.isDigit?10:spec.maxN;
  var freqs=new Array(featureSize).fill(0);
  var draws=rawDraws||[];
  if(!draws.length) return freqs.map(function(){return 1/featureSize});

  draws.forEach(function(d){
    if(!d||!d.numbers) return;
    if(spec.isDigit){
      d.numbers.forEach(function(s){
        String(s).split("").forEach(function(ch){
          var v=parseInt(ch,10);
          if(v>=0&&v<10) freqs[v]++;
        });
      });
    } else {
      var mains=gameType==="lotto535"?d.numbers.slice(0,5):d.numbers.slice(0,spec.count);
      mains.forEach(function(n){
        var idx=(typeof n==="number"?n:parseInt(n,10))-1;
        if(idx>=0&&idx<featureSize) freqs[idx]++;
      });
    }
  });
  var maxF=Math.max.apply(null,freqs.concat([1]));
  return freqs.map(function(f){return Math.max(f/maxF, 0.02)});
}

/** Ưu tiên dùng lastPredictionProbs (AI), không thì tần suất lịch sử thật */
function getActiveProbs(gameType){
  var spec=gameSpec(gameType);
  var featureSize=spec.isDigit?10:spec.maxN;
  if(lastPredictionProbs && lastPredictionProbs.length===featureSize){
    return lastPredictionProbs.slice();
  }
  return buildFreqProbs(gameType);
}

function weightedSampleUnique(candidates, count, used){
  var pool=candidates.map(function(c){
    return {number:c.number, prob:c.prob, w: used && used.has(c.number) ? c.prob*0.12 : Math.max(c.prob,0.001)};
  });
  var selected=[];
  for(var i=0;i<count&&pool.length;i++){
    var total=pool.reduce(function(s,x){return s+x.w},0);
    var r=Math.random()*total;
    for(var j=0;j<pool.length;j++){
      r-=pool[j].w;
      if(r<=0){ selected.push(pool[j].number); pool.splice(j,1); break; }
    }
  }
  return selected;
}

/** Sinh bộ số theo phân phối xác suất thật (AI hoặc tần suất lịch sử) — đúng thể lệ */
function sampleFromProbs(gameType, probs){
  var spec=gameSpec(gameType);
  if(spec.isDigit){
    var digProbs=(probs&&probs.length===10)?probs:new Array(10).fill(0.1);
    function gen3(){
      var digs=[];
      for(var k=0;k<3;k++){
        var pool=digProbs.map(function(p,i){return {number:i,prob:Math.max(p,0.001)}});
        digs.push(weightedSampleUnique(pool,1,new Set())[0]);
      }
      return digs.join("");
    }
    if(!spec.pairs) return [gen3()];
    var a=gen3(), b=gen3();
    var guard=0;
    while(b===a && guard++<50) b=gen3();
    return [a,b];
  }
  var featureSize=spec.maxN;
  var raw=probs&&probs.length===featureSize?probs:buildFreqProbs(gameType);
  var candidates=raw.map(function(p,i){return {number:i+1,prob:Math.max(p,0.001)}});
  var used=new Set();
  var main=weightedSampleUnique(candidates, spec.count, used).sort(function(a,b){return a-b});
  main.forEach(function(n){used.add(n)});
  if(spec.special){
    if(gameType==="power655"){
      var remain=candidates.filter(function(x){return !used.has(x.number)});
      var sp=weightedSampleUnique(remain,1,used)[0];
      if(sp==null){
        for(var i=1;i<=55;i++) if(!used.has(i)){ sp=i; break; }
      }
      return main.concat([sp]);
    }
    if(gameType==="lotto535"){
      // ĐB 1–12: dùng tần suất số đặc biệt nếu có trong lịch sử, không thì phân phối đều có trọng số nhẹ từ dữ liệu
      var spFreq=new Array(12).fill(0);
      (rawDraws||[]).forEach(function(d){
        if(d.numbers&&d.numbers.length>=6){
          var s=d.numbers[5];
          if(s>=1&&s<=12) spFreq[s-1]++;
        }
      });
      var maxS=Math.max.apply(null,spFreq.concat([1]));
      var spCand=spFreq.map(function(f,i){return {number:i+1,prob:Math.max(f/maxS,0.05)}});
      var sp=weightedSampleUnique(spCand,1,new Set())[0]||(1+Math.floor(Math.random()*12));
      return main.concat([sp]);
    }
  }
  return main;
}

function presetNums(kind){
  var gt=document.getElementById("gameTypeTf").value||currentGame||"mega645";
  if(currentGame==="keno"||currentGame==="bingo") gt=currentGame;
  showScan(function(){
    if(!rawDraws||!rawDraws.length){
      document.getElementById("resultArea").innerHTML="<span style='opacity:.7;font-size:.8rem'>Chưa có dữ liệu thật</span>";
      resetMeter();
      return;
    }
    var probs=getActiveProbs(gt).slice();
    var spec=gameSpec(gt);
    var featureSize=spec.isDigit?10:spec.maxN;
    // Điều chỉnh trọng số theo loại phân tích — vẫn dựa trên probs thật
    for(var i=0;i<featureSize;i++){
      var n=spec.isDigit?i:(i+1);
      if(kind==="hot") probs[i]*=(n%7===0||n%9===0)?1.35:1.05;
      else if(kind==="freq") probs[i]*=1.0; // giữ nguyên tần suất
      else if(kind==="high"){
        var mid=featureSize/2;
        probs[i]*=1+0.25*Math.abs(i-mid)/mid;
      } else {
        // popular: ưu tiên số xuất hiện nhiều trong 20 kỳ gần nhất
        probs[i]*=1.1;
      }
      probs[i]=Math.min(1, Math.max(0.02, probs[i]));
    }
    var nums=sampleFromProbs(gt, probs);
    displayResult(nums,gt,"preset");
    applyMeterScore(computeDynamicMeter(probs,[nums],gt,rawDraws.length));
  });
}

/* ========== DYNAMIC JACKPOT METER (chuẩn index-2, không random %) ========== */
function resetMeter(){
  lastMeterScore=0;
  document.getElementById("meterBar").style.width="0%";
  document.getElementById("meterScore").textContent="0%";
  var b=document.getElementById("meterBadge");
  b.textContent="CHỜ TÍNH...";
  b.style.background="rgba(148,163,184,.2)";
  b.style.color="#94a3b8";
  b.style.border="";
  b.style.animation="";
}
function computeDynamicMeter(probs, generatedSets, gameType, dataLen){
  if(!probs||!generatedSets||!generatedSets.length) return 0;
  var isDigit=String(gameType).indexOf("max3d")===0;
  var arr=Array.from(probs);
  var sorted=arr.slice().sort(function(a,b){return b-a});
  var n=arr.length;

  var meanProb=0, countNums=0;
  generatedSets.forEach(function(set){
    if(isDigit){
      String(set.join("")).split("").forEach(function(ch){
        var d=parseInt(ch,10);
        if(!isNaN(d)&&d<arr.length){ meanProb+=arr[d]; countNums++; }
      });
    } else {
      set.forEach(function(num){
        if(typeof num!=="number") return;
        var idx=num-1;
        if(idx>=0&&idx<arr.length){ meanProb+=arr[idx]; countNums++; }
      });
    }
  });
  meanProb=countNums>0?meanProb/countNums:0.1;

  var topK=Math.max(1,Math.floor(n*0.1));
  var sumAll=sorted.reduce(function(s,v){return s+v},0)||1;
  var topMass=sorted.slice(0,topK).reduce(function(s,v){return s+v},0)/sumAll;

  var sumP=arr.reduce(function(s,v){return s+Math.max(v,1e-9)},0);
  var entropy=0;
  arr.forEach(function(v){
    var p=Math.max(v,1e-9)/sumP;
    entropy-=p*Math.log2(p);
  });
  var maxEnt=Math.log2(n||2);
  var concentration=1-(entropy/maxEnt);

  var median=sorted[Math.floor(n/2)]||0.01;
  var separation=Math.min(1,(sorted[0]-median)/(sorted[0]+1e-6));

  var allNums=new Set();
  generatedSets.forEach(function(s){ s.forEach(function(x){ allNums.add(String(x)); }); });
  var expectedUnique=isDigit?generatedSets.length*3:generatedSets.length*6;
  var stability=Math.min(1, allNums.size/Math.max(expectedUnique*0.7,1));

  var dataQuality=Math.min(1,(dataLen||0)/40);

  var setMeans=generatedSets.map(function(set){
    var s=0,c=0;
    if(isDigit){
      String(set.join("")).split("").forEach(function(ch){
        var d=parseInt(ch,10);
        if(!isNaN(d)&&d<arr.length){s+=arr[d];c++;}
      });
    } else {
      set.forEach(function(num){
        if(typeof num!=="number") return;
        var idx=num-1;
        if(idx>=0&&idx<arr.length){s+=arr[idx];c++;}
      });
    }
    return c?s/c:0;
  });
  var avgMean=setMeans.reduce(function(a,b){return a+b},0)/setMeans.length;
  var variance=setMeans.reduce(function(a,m){return a+(m-avgMean)*(m-avgMean)},0)/setMeans.length;
  var agreement=Math.max(0,1-Math.sqrt(variance)*5);

  // Validation: probs phải hợp lệ
  var valid=arr.every(function(v){return isFinite(v)&&v>=0}) && countNums>0;
  if(!valid) return 0;

  var score=meanProb*28+topMass*18+concentration*12+separation*10+stability*12+dataQuality*12+agreement*8;
  return Math.min(99, Math.max(5, Math.round(score*1.15+meanProb*40)));
}
function applyMeterScore(score){
  lastMeterScore=Math.max(0,Math.min(100,Math.round(score)));
  document.getElementById("meterBar").style.width=lastMeterScore+"%";
  document.getElementById("meterScore").textContent=lastMeterScore+"%";
  var b=document.getElementById("meterBadge");
  b.style.animation="";

async function fetchWithTimeout(url,opts,ms){
  var ctrl=new AbortController(),t=setTimeout(function(){ctrl.abort()},ms||8000);
  try{var r=await fetch(url,Object.assign({},opts,{signal:ctrl.signal}));clearTimeout(t);return r}catch(e){clearTimeout(t);throw e}

function parseResultHtml(html,gameType){
  if(/Just a moment|cf-browser-verification|challenge-platform/i.test(html)) throw new Error("CF Challenge");
  var anchor=html.indexOf("day_so_ket_qua"); if(anchor<0) throw new Error("No result");
  var win=html.substring(anchor,anchor+2000);
  var balls=[];
  var re=/bong_tron[^"]*">\s*(\d+)\s*</g, m;
  while((m=re.exec(win))) balls.push(m[1]);
  if(!balls.length) throw new Error("No balls");
  var numbers;
  if(String(gameType).indexOf("max3d")===0){
    var digits=balls.join(""),triplets=[];
    for(var i=0;i<=digits.length-3;i+=3) triplets.push(digits.substring(i,i+3));
    numbers=gameType==="max3d"?triplets.slice(0,1):triplets.slice(0,2);
  } else numbers=balls.map(function(n){return parseInt(n,10)});
  var idMatch=html.match(/[Kk]ỳ quay(?: thưởng)?\s*<b>#?(\d+)<\/b>\s*ngày\s*<b>([\d\/]+)<\/b>/);
  if(!idMatch) throw new Error("No id");
  var jackpot=null,jm=html.match(/so_tien">\s*<h3>([\d.]+)<\/h3>/);
  if(jm) jackpot=parseInt(jm[1].replace(/\./g,""),10);
  return {id:"#"+idMatch[1],date:idMatch[2],numbers:numbers,jackpot:jackpot};
}

function resolveAlgo(gameType){
  var n=(rawDraws&&rawDraws.length)||0;
  if(n>=50) return {algo:"tf-lstm",reason:n+" kỳ thật → LSTM"};
  if(n>=20) return {algo:"tf-dense",reason:n+" kỳ thật → Dense"};
  if(n>=8) return {algo:"hot-cold-hybrid",reason:n+" kỳ thật → Hot/Cold"};
  if(n>=1) return {algo:"freq-weighted",reason:n+" kỳ thật → Frequency"};
  return {algo:"freq-weighted",reason:"Chưa có dữ liệu"};
}

function clearTrainLog(){document.getElementById("trainLog").innerHTML=""}

async function trainAndPredict(){
  var btn=document.getElementById("btnTrain"),progress=document.getElementById("trainProgress");
  var gameType=document.getElementById("gameTypeTf").value; currentGame=gameType;

  if(!rawDraws||rawDraws.length<1){
    logTrain("<b style='color:#f87171'>[Lỗi]</b> Không có dữ liệu thật. Đang thử kết nối Live…");
    await initLive();
    if(!rawDraws||rawDraws.length<1){
      logTrain("<b style='color:#f87171'>[Lỗi]</b> Vẫn chưa có kỳ quay thật. Kiểm tra Worker/GitHub.");
      return;
    }
  }

  var resolved=resolveAlgo(gameType),algoType=resolved.algo;
  document.getElementById("autoAlgoHint").textContent="Model: "+algoType+" · "+resolved.reason;
  btn.disabled=true; clearTrainLog(); resetMeter();
  document.getElementById("predictionsList").innerHTML="";

  var spec=gameSpec(gameType);
  var maxNum=spec.maxN;
  var isDigit=spec.isDigit;
  var featureSize=isDigit?10:maxNum;

  progress.style.width="8%";
  logTrain("<b>[Init]</b> "+algoType+" · "+rawDraws.length+" kỳ THẬT");
  if(window.tf) await tf.nextFrame();

  var chronological=rawDraws.slice().reverse();
  var vectors=chronological.map(function(d){
    var v=new Array(featureSize).fill(0);
    if(isDigit){
      d.numbers.forEach(function(s){String(s).split("").forEach(function(ch){v[parseInt(ch,10)]++})});
    } else {
      var mains=gameType==="lotto535"?d.numbers.slice(0,5):d.numbers.slice(0,6);
      mains.forEach(function(n){ if(n>=1&&n<=maxNum) v[n-1]=1; });
    }
    return v;
  });
  if(vectors.length<2) vectors.push(vectors[0].slice());

  var predictionData;
  if(algoType==="freq-weighted"||algoType==="hot-cold-hybrid"){
    progress.style.width="40%";
    var freqs=new Array(featureSize).fill(0);
    vectors.forEach(function(v){v.forEach(function(val,i){freqs[i]+=val})});
    var maxF=Math.max.apply(null,freqs.concat([1]));
    predictionData=freqs.map(function(f){return Math.max(f/maxF,0.02)});
    if(algoType==="hot-cold-hybrid"){
      var lastSeen=new Array(featureSize).fill(vectors.length);
      for(var t=vectors.length-1;t>=0;t--)
        for(var i=0;i<featureSize;i++)
          if(vectors[t][i]>0&&lastSeen[i]===vectors.length) lastSeen[i]=vectors.length-1-t;
      var maxGap=Math.max.apply(null,lastSeen.concat([1]));
      predictionData=predictionData.map(function(p,i){return Math.min(1,p*0.85+0.15*(lastSeen[i]/maxGap)+0.05)});
      logTrain("<b>[Hot/Cold]</b> Tần suất + khoảng cách thật");
    } else logTrain("<b>[Freq]</b> Tần suất lịch sử thật");
    progress.style.width="85%";
  } else if(window.tf&&(algoType==="tf-dense"||algoType==="tf-lstm")){
    var epochs=algoType==="tf-lstm"?18:12;
    var timesteps=Math.min(5,Math.max(1,vectors.length-1));
    var useLstm=algoType==="tf-lstm"&&vectors.length>timesteps;
    var xs,ys,model;
    if(useLstm){
      var seqIn=[],seqLab=[];
      for(var i=0;i<=vectors.length-timesteps-1;i++){seqIn.push(vectors.slice(i,i+timesteps));seqLab.push(vectors[i+timesteps])}
      xs=tf.tensor3d(seqIn); ys=tf.tensor2d(seqLab);
      model=tf.sequential();
      model.add(tf.layers.lstm({units:48,inputShape:[timesteps,featureSize],returnSequences:false}));
      model.add(tf.layers.dropout({rate:0.25}));
      model.add(tf.layers.dense({units:32,activation:"relu"}));
      model.add(tf.layers.dense({units:featureSize,activation:"sigmoid"}));
      logTrain("<b>[LSTM]</b> Huấn luyện trên "+rawDraws.length+" kỳ thật");
    } else {
      xs=tf.tensor2d(vectors.slice(0,-1)); ys=tf.tensor2d(vectors.slice(1));
      model=tf.sequential();
      model.add(tf.layers.dense({units:96,activation:"relu",inputShape:[featureSize]}));
      model.add(tf.layers.dropout({rate:0.25}));
      model.add(tf.layers.dense({units:48,activation:"relu"}));
      model.add(tf.layers.dense({units:featureSize,activation:"sigmoid"}));
      logTrain("<b>[Dense]</b> 96→48→"+featureSize+" · data thật");
    }
    model.compile({optimizer:tf.train.adam(0.01),loss:"binaryCrossentropy"});
    progress.style.width="25%";
    await model.fit(xs,ys,{epochs:epochs,batchSize:Math.min(16,xs.shape[0]),shuffle:true,callbacks:{onEpochEnd:async function(epoch,logs){
      progress.style.width=Math.floor(25+((epoch+1)/epochs)*60)+"%";
      logTrain("Epoch <b>"+(epoch+1)+"/"+epochs+"</b> loss:<b>"+(logs.loss!=null?logs.loss.toFixed(4):"—")+"</b>");
      await tf.nextFrame();
    }}});
    progress.style.width="95%";
    predictionData=tf.tidy(function(){
      var input=useLstm?tf.tensor3d([vectors.slice(vectors.length-timesteps)]):tf.tensor2d([vectors[vectors.length-1]]);
      return model.predict(input).dataSync().slice();
    });
    xs.dispose();ys.dispose();model.dispose();
  } else {
    predictionData=buildFreqProbs(gameType);
    logTrain("<b>[Freq]</b> Tần suất thật (TF chưa sẵn sàng)");
  }

  progress.style.width="100%";
  lastPredictionProbs=predictionData.slice();
  logTrain("<b>[Xong]</b> Phân phối "+featureSize+" vị trí từ data thật");

  var allSets=[];
  var listEl=document.getElementById("predictionsList");
  listEl.innerHTML="";
  var usedGlobal=new Set();
  for(var c=0;c<2;c++){
    var selected=sampleFromProbs(gameType, predictionData);
    // tránh trùng set
    var key=selected.join("-");
    var attempts=0;
    while(allSets.some(function(s){return s.join("-")===key})&&attempts++<40){
      selected=sampleFromProbs(gameType, predictionData);
      key=selected.join("-");
    }
    allSets.push(selected);
    var row=document.createElement("div"); row.className="set-row";
    row.innerHTML='<span class="set-tag">#'+(c+1)+'</span><div style="display:flex;flex-wrap:wrap;gap:2px">'+renderBalls(selected,gameType)+'</div>';
    listEl.appendChild(row);
  }
  displayResult(allSets[0],gameType,"ai");
  applyMeterScore(computeDynamicMeter(predictionData,allSets,gameType,rawDraws.length));
  playResult(); fireworks(); vibratePhone();
  btn.disabled=false;
}

async function initLive(){
  var gameType=document.getElementById("gameTypeTf").value; currentGame=gameType;
  setLiveStatus(false,"...");
  resetMeter();
  try{
    var fresh=await loadLiveData(gameType);
    if(!fresh||!fresh.length){
      rawDraws=[];
      setLiveStatus(false,"No data");
      logTrain("<b style='color:#fbbf24'>[Live]</b> Chưa có kỳ thật trên GitHub/Vietlott");
      return;
    }
    var newId=fresh[0]&&fresh[0].id;
    if(lastSeenDrawId&&newId&&lastSeenDrawId!==newId){
      lastPredictionProbs=null;
      resetMeter();
      logTrain("<b>[Kỳ mới]</b> "+newId+" → reset Meter");
    }
    lastSeenDrawId=newId;
    rawDraws=fresh;
    setLiveStatus(true,rawDraws.length+" kỳ");
    var r=resolveAlgo(gameType);
    document.getElementById("autoAlgoHint").textContent="Model: "+r.algo+" · "+r.reason;
  }catch(e){
    rawDraws=[];
    setLiveStatus(false,"Offline");
    logTrain("<b style='color:#f87171'>[Lỗi]</b> "+(e.message||e));
  }
}
setInterval(async function(){
  if(document.hidden) return;
  try{
    var gt=document.getElementById("gameTypeTf").value;
    var prev=rawDraws[0]&&rawDraws[0].id;
    var fresh=await loadLiveData(gt);
    if(fresh&&fresh.length&&(!prev||fresh[0].id!==prev)){
      rawDraws=fresh;
      lastPredictionProbs=null;
      resetMeter();
      lastSeenDrawId=fresh[0].id;
      setLiveStatus(true,rawDraws.length+" kỳ · mới");
      logTrain("<b>[Kỳ mới]</b> "+fresh[0].id);
    }
  }catch(e){}
},60000);

window.onload=function(){
  initLive();
  if(window.tf) tf.ready().then(function(){logTrain("<b>[TF]</b> "+tf.getBackend())});
};
</script>
